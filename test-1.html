<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta 1 — La Fórmula del Saber | Arturo Alba</title>
    <link rel="icon" href="assets/images/favicon.png">
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* ===== TEMPLATE D: Drag & Drop ===== */

        .quiz--template-d .quiz__panel--full {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .quiz--template-d .quiz__header {
            padding: 2.5rem 3rem 1.25rem;
            text-align: center;
            flex-shrink: 0;
        }

        .quiz--template-d .quiz__drag-hint {
            font-family: 'Optima', 'Palatino Linotype', Palatino, serif;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            margin-top: 0.55rem;
        }

        /* Drag interface: pool (left) + drop area (right) */
        .quiz__drag-interface {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ---- Pool (left side) ---- */
        .quiz__pool {
            position: relative;
            width: 50%;
            flex-shrink: 0;
        }

        .quiz__drag-item {
            position: absolute;
            cursor: grab;
            user-select: none;
            transform: rotate(var(--rot, 0deg));
            transition: transform 0.18s ease, z-index 0s;
            z-index: 1;
        }

        .quiz__drag-item:hover {
            transform: rotate(var(--rot, 0deg)) scale(1.07);
            z-index: 10;
        }

        .quiz__drag-item:active {
            cursor: grabbing;
        }

        .quiz__drag-item img {
            display: block;
            max-height: 175px;
            width: auto;
            pointer-events: none;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.55));
        }

        /* Hover label: appears to the right of the image */
        .quiz__drag-label {
            position: absolute;
            left: calc(100% + 14px);
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Optima', 'Palatino Linotype', Palatino, serif;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 0.68rem;
            letter-spacing: 0.15em;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .quiz__drag-item:hover .quiz__drag-label {
            opacity: 1;
        }

        /* ---- Drop area (right side) ---- */
        .quiz__drop-area {
            width: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 2rem;
        }

        .quiz__drop-zone {
            width: 130px;
            height: 190px;
            border: 1.5px solid #e07630;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            flex-shrink: 0;
        }

        .quiz__drop-zone.is-over {
            background-color: rgba(224, 118, 48, 0.12);
            border-color: #ff9550;
        }

        .quiz__drop-zone .quiz__zone-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
            cursor: grab;
        }

        .quiz__drop-plus {
            font-family: 'Optima', 'Palatino Linotype', Palatino, serif;
            color: #e07630;
            font-size: 1.9rem;
            flex-shrink: 0;
            user-select: none;
        }
    </style>
</head>
<body class="quiz quiz--full quiz--template-d quiz--q1" data-question="1">

<main class="quiz__panel--full">

    <div class="quiz__header">
        <h1 class="quiz__question quiz__question--center">&#191;Qu&#233; productos de Arturo Alba se combinan para realizar la Doble Limpieza?</h1>
        <p class="quiz__drag-hint">Arrastra un producto a cada rect&#225;ngulo</p>
    </div>

    <div class="quiz__drag-interface">

        <!-- Pool: 7 productos dispersos -->
        <div class="quiz__pool" id="pool">

            <div class="quiz__drag-item" id="item-agua-micelar" data-product="agua-micelar"
                 draggable="true" style="left:4%;top:6%;--rot:-7deg">
                <img src="assets/images/test-1-agua-micelar-D.png" alt="Agua Micelar" draggable="false">
                <span class="quiz__drag-label">Agua Micelar</span>
            </div>

            <div class="quiz__drag-item" id="item-limpiadora-espumosa" data-product="limpiadora-espumosa"
                 draggable="true" style="left:32%;top:3%;--rot:5deg">
                <img src="assets/images/test-1-limpiadora-espumosa-D.png" alt="Limpiadora Espumosa" draggable="false">
                <span class="quiz__drag-label">Limpiadora Espumosa</span>
            </div>

            <div class="quiz__drag-item" id="item-manteca" data-product="manteca"
                 draggable="true" style="left:6%;top:40%;--rot:-4deg">
                <img src="assets/images/test-1-manteca-D.png" alt="Manteca de Primera Limpieza" draggable="false">
                <span class="quiz__drag-label">Manteca de Primera Limpieza</span>
            </div>

            <div class="quiz__drag-item" id="item-infusion" data-product="infusion"
                 draggable="true" style="left:37%;top:34%;--rot:7deg">
                <img src="assets/images/test-1-infusion-D.png" alt="Infusi&#243;n Absoluta Exopept&#237;dica" draggable="false">
                <span class="quiz__drag-label">Infusi&#243;n Absoluta</span>
            </div>

            <div class="quiz__drag-item" id="item-rapsodia" data-product="rapsodia"
                 draggable="true" style="left:2%;top:68%;--rot:-9deg">
                <img src="assets/images/test-1-rapsodia-D.png" alt="Rapsodia Alta Recuperaci&#243;n" draggable="false">
                <span class="quiz__drag-label">Rapsodia Alta Recuperaci&#243;n</span>
            </div>

            <div class="quiz__drag-item" id="item-retinoide" data-product="retinoide"
                 draggable="true" style="left:33%;top:61%;--rot:4deg">
                <img src="assets/images/test-1-retinoide-D.png" alt="Retinoide Extremo" draggable="false">
                <span class="quiz__drag-label">Retinoide Extremo</span>
            </div>

            <div class="quiz__drag-item" id="item-solucion-exfoliante" data-product="solucion-exfoliante"
                 draggable="true" style="left:17%;top:75%;--rot:-6deg">
                <img src="assets/images/test-1-solucion-exfoliante-D.png" alt="Soluci&#243;n Qu&#237;mica Exfoliante" draggable="false">
                <span class="quiz__drag-label">Soluci&#243;n Exfoliante</span>
            </div>

        </div>

        <!-- Zona de drop: dos rectángulos con borde naranja + símbolo + -->
        <div class="quiz__drop-area">
            <div class="quiz__drop-zone" id="zone-0" data-zone="0"></div>
            <div class="quiz__drop-plus" aria-hidden="true">+</div>
            <div class="quiz__drop-zone" id="zone-1" data-zone="1"></div>
        </div>

    </div>

    <a href="test-2.html" class="quiz__next" aria-disabled="true">SIGUIENTE &#8594;</a>

</main>

<script>
(function () {
    "use strict";

    var body    = document.body;
    var page    = body.dataset.question;        // "1"
    var nextBtn = document.querySelector(".quiz__next");
    var pool    = document.getElementById("pool");
    var zoneEls = [
        document.getElementById("zone-0"),
        document.getElementById("zone-1")
    ];

    /* Qué producto hay en cada zona (null = vacía) */
    var zoneContent = [null, null];

    /* Estado del arrastre en curso */
    var dragState = null; // { product: string, fromZone: null|0|1 }

    /* -------- Utilidades -------- */

    function getPoolItem(product) {
        return document.getElementById("item-" + product);
    }

    function hidePoolItem(product) {
        var el = getPoolItem(product);
        if (el) el.style.visibility = "hidden";
    }

    function showPoolItem(product) {
        var el = getPoolItem(product);
        if (el) el.style.visibility = "visible";
    }

    function clearZone(zoneIndex) {
        var existing = zoneEls[zoneIndex].querySelector(".quiz__zone-img");
        if (existing) zoneEls[zoneIndex].removeChild(existing);
    }

    function renderZone(zoneIndex, product) {
        clearZone(zoneIndex);

        var sourceImg = getPoolItem(product).querySelector("img");
        var img = document.createElement("img");
        img.src       = sourceImg.src;
        img.alt       = sourceImg.alt;
        img.className = "quiz__zone-img";
        img.draggable = true;

        /* Al arrastrar la imagen de la zona */
        img.addEventListener("dragstart", function (e) {
            dragState = { product: product, fromZone: zoneIndex };
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", product);
        });
        img.addEventListener("dragend", function () {
            dragState = null;
        });

        zoneEls[zoneIndex].appendChild(img);
    }

    function updateAnswer() {
        if (zoneContent[0] !== null && zoneContent[1] !== null) {
            var sorted = [zoneContent[0], zoneContent[1]].sort();
            try { sessionStorage.setItem("respuesta-" + page, sorted.join("+")); } catch (e) {}
            nextBtn.classList.add("is-active");
            nextBtn.removeAttribute("aria-disabled");
        } else {
            try { sessionStorage.removeItem("respuesta-" + page); } catch (e) {}
            nextBtn.classList.remove("is-active");
            nextBtn.setAttribute("aria-disabled", "true");
        }
    }

    /* -------- Pool: arrastre de productos -------- */

    pool.querySelectorAll(".quiz__drag-item").forEach(function (item) {
        var product = item.dataset.product;

        item.addEventListener("dragstart", function (e) {
            dragState = { product: product, fromZone: null };
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", product);
            /* Ocultar tras un tick para que el ghost se renderice */
            setTimeout(function () { item.style.visibility = "hidden"; }, 0);
        });

        item.addEventListener("dragend", function () {
            /* Si el producto no quedó en ninguna zona, restaurar visibilidad */
            if (zoneContent.indexOf(product) === -1) {
                item.style.visibility = "visible";
            }
            dragState = null;
        });
    });

    /* -------- Zonas: reciben el drop -------- */

    zoneEls.forEach(function (zone, zoneIndex) {

        zone.addEventListener("dragover", function (e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            zone.classList.add("is-over");
        });

        zone.addEventListener("dragleave", function (e) {
            if (!zone.contains(e.relatedTarget)) {
                zone.classList.remove("is-over");
            }
        });

        zone.addEventListener("drop", function (e) {
            e.preventDefault();
            zone.classList.remove("is-over");
            if (!dragState) return;

            var incoming = dragState.product;
            var fromZone = dragState.fromZone;
            var existing = zoneContent[zoneIndex];

            /* Misma zona: no hacer nada */
            if (fromZone === zoneIndex) {
                dragState = null;
                return;
            }

            if (fromZone === null) {
                /* Pool → Zona */
                hidePoolItem(incoming);
                if (existing !== null) {
                    /* La zona tenía algo: devolver al pool */
                    showPoolItem(existing);
                    clearZone(zoneIndex);
                }
            } else {
                /* Zona → Zona */
                if (existing !== null) {
                    /* Intercambio: el contenido actual va a la zona de origen */
                    zoneContent[fromZone] = existing;
                    renderZone(fromZone, existing);
                } else {
                    /* Traslado simple: vaciar zona de origen */
                    zoneContent[fromZone] = null;
                    clearZone(fromZone);
                }
            }

            zoneContent[zoneIndex] = incoming;
            renderZone(zoneIndex, incoming);
            dragState = null;
            updateAnswer();
        });
    });

    /* -------- Pool: acepta imágenes de zona (devolución al pool) -------- */

    pool.addEventListener("dragover", function (e) {
        if (dragState && dragState.fromZone !== null) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
        }
    });

    pool.addEventListener("drop", function (e) {
        e.preventDefault();
        if (!dragState || dragState.fromZone === null) return;

        var product  = dragState.product;
        var fromZone = dragState.fromZone;

        zoneContent[fromZone] = null;
        clearZone(fromZone);
        showPoolItem(product);

        dragState = null;
        updateAnswer();
    });

    /* -------- Botón Siguiente: guard -------- */

    nextBtn.addEventListener("click", function (e) {
        if (!nextBtn.classList.contains("is-active")) e.preventDefault();
    });

})();
</script>

</body>
</html>
