<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta 1 — La Fórmula del Saber | Arturo Alba</title>
    <link rel="icon" href="assets/images/favicon.png">
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* ===== TEMPLATE D: Drag & Drop ===== */

        /* FIX 1 — Panel: anular padding heredado del grid base,
           convertir a flex-columna ocupando toda la pantalla          */
        .quiz--template-d .quiz__panel--full {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 0;
            gap: 0;
            overflow: hidden;
        }

        /* FIX 1 — Header: ancho completo, centrado sobre toda la página */
        .quiz--template-d .quiz__header {
            width: 100%;
            box-sizing: border-box;
            padding: 3.5rem 4rem 1rem;
            text-align: center;
            flex-shrink: 0;
        }

        /* FIX 1 — La pregunta: anular margin: 0 0 2.5rem de .quiz__question
           (que por orden de cascada aplasta el margin: 0 auto de --center)  */
        .quiz--template-d .quiz__question.quiz__question--center {
            margin: 0 auto;
            max-width: 72rem;
            text-align: center;
        }

        /* FIX 3 — Subtítulo en Silka, frase normal, sin interletrado extra,
           movido a la parte inferior (fuera del header)                      */
        .quiz--template-d .quiz__drag-hint {
            font-family: "Silka", sans-serif;
            color: rgba(255, 255, 255, 0.48);
            font-size: 0.88rem;
            letter-spacing: normal;
            text-transform: none;
            text-align: center;
            width: 100%;
            flex-shrink: 0;
            padding: 0.6rem 0;
            box-sizing: border-box;
        }

        /* Drag interface: pool (2/3) + zona drop (1/3) */
        .quiz__drag-interface {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* FIX 2 — Pool: ocupa 2/3 del ancho */
        .quiz__pool {
            position: relative;
            width: 66.67%;
            flex-shrink: 0;
        }

        .quiz__drag-item {
            position: absolute;
            cursor: grab;
            user-select: none;
            transform: rotate(var(--rot, 0deg));
            transition: transform 0.18s ease;
            z-index: 1;
        }

        .quiz__drag-item:hover {
            transform: rotate(var(--rot, 0deg)) scale(1.07);
            z-index: 10;
        }

        .quiz__drag-item:active {
            cursor: grabbing;
        }

        .quiz__drag-item img {
            display: block;
            max-height: 160px;
            width: auto;
            pointer-events: none;
            filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
        }

        /* FIX 4 — Etiqueta: width fijo (evita colapso shrink-to-fit),
           tamaño grande, izquierda, ~3-4 renglones                    */
        .quiz__drag-label {
            position: absolute;
            left: calc(100% + 14px);
            top: 50%;
            transform: translateY(-50%);
            font-family: "Optima", "Palatino Linotype", Palatino, serif;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.07em;
            line-height: 1.25;
            white-space: normal;
            width: 160px;
            text-align: left;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .quiz__drag-item:hover .quiz__drag-label {
            opacity: 1;
        }

        /* Zona de drop: 1/3 del ancho */
        .quiz__drop-area {
            width: 33.33%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.75rem;
            padding: 2rem 2rem 2rem 0;
        }

        .quiz__drop-zone {
            width: 155px;
            height: 220px;
            border: 1.5px solid #ff6b00;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background-color 0.15s ease, border-color 0.15s ease;
            flex-shrink: 0;
        }

        .quiz__drop-zone.is-over {
            background-color: rgba(224, 118, 48, 0.12);
            border-color: #ff6b00;
        }

        .quiz__drop-zone .quiz__zone-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
            cursor: grab;
        }

        .quiz__drop-plus {
            font-family: "Optima", "Palatino Linotype";
            color: #ff6b00;
            font-size: 3rem;
            font-weight: bolder;
            flex-shrink: 0;
            user-select: none;
        }

        /* FIX 5 — Botón: alineado a la derecha, sin movimiento al hover */
        .quiz--template-d .quiz__next {
            align-self: flex-end;
            margin: 0 3.5rem 2rem 0;
        }

        /* Neutralizar el scale que causa la sensación de movimiento */
        .quiz--template-d .quiz__next.is-active:hover,
        .quiz--template-d .quiz__next.is-active:focus-visible {
            transform: none;
            opacity: 0.8;
        }

        /* Nombre del producto en zona (visible solo en móvil) */
        .quiz__zone-name {
            display: none;
        }

        /* ===== MÓVIL ===== */
        @media (max-width: 768px) {
            .quiz--template-d .quiz__header {
                padding: 2rem 1.5rem 0.75rem;
            }
            .quiz__drag-interface {
                flex-direction: column-reverse;
            }
            .quiz__pool {
                width: 100%;
                flex: 1;
                min-height: 0;
            }
            .quiz__drop-area {
                width: 100%;
                flex-direction: column;
                align-items: center;
                padding: 0.5rem 1rem;
                gap: 0.3rem;
                flex-shrink: 0;
                justify-content: center;
            }
            .quiz__drop-zone {
                width: 100%;
                max-width: 340px;
                height: 46px;
                padding: 6px 10px;
            }
            .quiz__drop-plus {
                font-size: 1.4rem;
            }
            .quiz__drag-label {
                top: calc(100% + 4px);
                left: 50%;
                transform: translateX(-50%);
                font-size: 0.55rem;
                width: 60px;
                opacity: 1;
                text-align: center;
            }
            .quiz__drag-item:hover .quiz__drag-label {
                opacity: 1;
            }
            .quiz__zone-name {
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "Optima", "Palatino Linotype", Palatino, serif;
                color: #ff6b00;
                text-transform: uppercase;
                font-size: 0.72rem;
                letter-spacing: 0.06em;
                text-align: center;
                width: 100%;
                padding: 0 0.5rem;
                box-sizing: border-box;
                line-height: 1.2;
            }
            .quiz__zone-img {
                display: none;
            }
            .quiz--template-d .quiz__next {
                align-self: center;
                margin: 0.4rem 0 0.8rem 0;
            }
        }
    </style>
</head>
<body class="quiz quiz--full quiz--template-d quiz--q1" data-question="1">

<main class="quiz__panel--full">

    <div class="quiz__header">
        <h1 class="quiz__question quiz__question--center">&#191;Qu&#233; productos de Arturo Alba se combinan para realizar la Doble Limpieza?</h1>
    </div>

    <div class="quiz__drag-interface">

        <!-- Pool: 7 productos dispersos en 2/3 de la pantalla -->
        <div class="quiz__pool" id="pool">

            <div class="quiz__drag-item" id="item-agua-micelar" data-product="agua-micelar"
                 draggable="true" style="left:17%;top:19%;--rot:-7deg">
                <img src="assets/images/test-1-agua-micelar-D.png" alt="Agua Micelar" draggable="false">
                <span class="quiz__drag-label">Agua <br> Micelar</span>
            </div>

            <div class="quiz__drag-item" id="item-limpiadora-espumosa" data-product="limpiadora-espumosa"
                 draggable="true" style="left:74%;top:22%;--rot:12deg">
                <img src="assets/images/test-1-limpiadora-espumosa-D.png" alt="Limpiadora Espumosa" draggable="false">
                <span class="quiz__drag-label">Limpiadora Espumosa</span>
            </div>

            <div class="quiz__drag-item" id="item-manteca" data-product="manteca"
                 draggable="true" style="left:10%;top:50%;--rot:10deg">
                <img src="assets/images/test-1-manteca-D.png" alt="Manteca de Primera Limpieza" draggable="false">
                <span class="quiz__drag-label">Manteca <br> de Primera <br> Limpieza</span>
            </div>

            <div class="quiz__drag-item" id="item-infusion" data-product="infusion"
                 draggable="true" style="left:42%;top:10%;--rot:0deg">
                <img src="assets/images/test-1-infusion-D.png" alt="Infusi&#243;n Absoluta" draggable="false">
                <span class="quiz__drag-label">Infusi&#243;n Absoluta</span>
            </div>

            <div class="quiz__drag-item" id="item-rapsodia" data-product="rapsodia"
                 draggable="true" style="left:34%;top:81%;--rot:-9deg">
                <img src="assets/images/test-1-rapsodia-D.png" alt="Rapsodia Alta Recuperaci&#243;n" draggable="false">
                <span class="quiz__drag-label">Rapsodia Alta Recuperaci&#243;n</span>
            </div>

            <div class="quiz__drag-item" id="item-retinoide" data-product="retinoide"
                 draggable="true" style="left:64%;top:62%;--rot:-10deg">
                <img src="assets/images/test-1-retinoide-D.png" alt="Retinoide Extremo" draggable="false">
                <span class="quiz__drag-label">Retinoide Extremo</span>
            </div>

            <div class="quiz__drag-item" id="item-solucion-exfoliante" data-product="solucion-exfoliante"
                 draggable="true" style="left:42%;top:48%;--rot:-7deg">
                <img src="assets/images/test-1-solucion-exfoliante-D.png" alt="Soluci&#243;n Exfoliante" draggable="false">
                <span class="quiz__drag-label">Soluci&#243;n Exfoliante</span>
            </div>

        </div>

        <!-- Zona de drop: dos rectángulos + símbolo + -->
        <div class="quiz__drop-area">
            <div class="quiz__drop-zone" id="zone-0" data-zone="0"></div>
            <div class="quiz__drop-plus" aria-hidden="true">+</div>
            <div class="quiz__drop-zone" id="zone-1" data-zone="1"></div>
        </div>

    </div>

    <a href="test-2.html" class="quiz__next" aria-disabled="true">SIGUIENTE &#8594;</a>

    <p class="quiz__drag-hint">Arrastra un producto a cada rect&#225;ngulo</p>

</main>

<script>
(function () {
    "use strict";

    var body    = document.body;
    var page    = body.dataset.question;        // "1"
    var nextBtn = document.querySelector(".quiz__next");
    var pool    = document.getElementById("pool");
    var zoneEls = [
        document.getElementById("zone-0"),
        document.getElementById("zone-1")
    ];

    /* Qué producto hay en cada zona (null = vacía) */
    var zoneContent = [null, null];

    /* Estado del arrastre en curso */
    var dragState = null; // { product: string, fromZone: null | 0 | 1 }

    /* -------- Utilidades -------- */

    function getPoolItem(product) {
        return document.getElementById("item-" + product);
    }

    function hidePoolItem(product) {
        var el = getPoolItem(product);
        if (el) el.style.visibility = "hidden";
    }

    function showPoolItem(product) {
        var el = getPoolItem(product);
        if (el) el.style.visibility = "visible";
    }

    function clearZone(zoneIndex) {
        var existing = zoneEls[zoneIndex].querySelector(".quiz__zone-img");
        if (existing) zoneEls[zoneIndex].removeChild(existing);
        var nameEl = zoneEls[zoneIndex].querySelector(".quiz__zone-name");
        if (nameEl) zoneEls[zoneIndex].removeChild(nameEl);
    }

    function renderZone(zoneIndex, product) {
        clearZone(zoneIndex);

        var sourceImg = getPoolItem(product).querySelector("img");
        var img = document.createElement("img");
        img.src       = sourceImg.src;
        img.alt       = sourceImg.alt;
        img.className = "quiz__zone-img";
        img.draggable = true;

        /* Al arrastrar la imagen ya colocada en la zona */
        img.addEventListener("dragstart", function (e) {
            dragState = { product: product, fromZone: zoneIndex };
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", product);
        });
        img.addEventListener("dragend", function () {
            dragState = null;
        });

        zoneEls[zoneIndex].appendChild(img);

        /* Nombre del producto (visible en móvil en lugar de imagen) */
        var labelEl = getPoolItem(product).querySelector(".quiz__drag-label");
        var nameSpan = document.createElement("span");
        nameSpan.className = "quiz__zone-name";
        nameSpan.textContent = labelEl
            ? labelEl.textContent.replace(/\s+/g, " ").trim()
            : product;
        zoneEls[zoneIndex].appendChild(nameSpan);
    }

    function updateAnswer() {
        if (zoneContent[0] !== null && zoneContent[1] !== null) {
            var sorted = [zoneContent[0], zoneContent[1]].sort();
            try { sessionStorage.setItem("respuesta-" + page, sorted.join("+")); } catch (e) {}
            nextBtn.classList.add("is-active");
            nextBtn.removeAttribute("aria-disabled");
        } else {
            try { sessionStorage.removeItem("respuesta-" + page); } catch (e) {}
            nextBtn.classList.remove("is-active");
            nextBtn.setAttribute("aria-disabled", "true");
        }
    }

    /* -------- Pool: arrastre de productos -------- */

    pool.querySelectorAll(".quiz__drag-item").forEach(function (item) {
        var product = item.dataset.product;

        item.addEventListener("dragstart", function (e) {
            dragState = { product: product, fromZone: null };
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", product);
            /* Ocultar tras un tick para que el ghost se renderice bien */
            setTimeout(function () { item.style.visibility = "hidden"; }, 0);
        });

        item.addEventListener("dragend", function () {
            /* Si el producto no quedó en ninguna zona, restaurar */
            if (zoneContent.indexOf(product) === -1) {
                item.style.visibility = "visible";
            }
            dragState = null;
        });
    });

    /* -------- Zonas: reciben el drop -------- */

    zoneEls.forEach(function (zone, zoneIndex) {

        zone.addEventListener("dragover", function (e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            zone.classList.add("is-over");
        });

        zone.addEventListener("dragleave", function (e) {
            if (!zone.contains(e.relatedTarget)) {
                zone.classList.remove("is-over");
            }
        });

        zone.addEventListener("drop", function (e) {
            e.preventDefault();
            zone.classList.remove("is-over");
            if (!dragState) return;

            var incoming = dragState.product;
            var fromZone = dragState.fromZone;
            var existing = zoneContent[zoneIndex];

            /* Misma zona: sin cambios */
            if (fromZone === zoneIndex) {
                dragState = null;
                return;
            }

            if (fromZone === null) {
                /* Pool → Zona */
                hidePoolItem(incoming);
                if (existing !== null) {
                    /* Zona ocupada: devolver su contenido al pool */
                    showPoolItem(existing);
                    clearZone(zoneIndex);
                }
            } else {
                /* Zona → Zona (intercambio o traslado) */
                if (existing !== null) {
                    /* Intercambio: el contenido actual va a la zona de origen */
                    zoneContent[fromZone] = existing;
                    renderZone(fromZone, existing);
                } else {
                    /* Traslado simple: vaciar zona de origen */
                    zoneContent[fromZone] = null;
                    clearZone(fromZone);
                }
            }

            zoneContent[zoneIndex] = incoming;
            renderZone(zoneIndex, incoming);
            dragState = null;
            updateAnswer();
        });
    });

    /* -------- Pool: acepta devoluciones desde las zonas -------- */

    pool.addEventListener("dragover", function (e) {
        if (dragState && dragState.fromZone !== null) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
        }
    });

    pool.addEventListener("drop", function (e) {
        e.preventDefault();
        if (!dragState || dragState.fromZone === null) return;

        var product  = dragState.product;
        var fromZone = dragState.fromZone;

        zoneContent[fromZone] = null;
        clearZone(fromZone);
        showPoolItem(product);

        dragState = null;
        updateAnswer();
    });

    /* -------- Botón Siguiente: guard -------- */

    nextBtn.addEventListener("click", function (e) {
        if (!nextBtn.classList.contains("is-active")) e.preventDefault();
    });

    /* -------- Soporte táctil (móvil) -------- */
    (function () {
        var touchItem = null;

        function zoneFromPoint(x, y) {
            var hit = document.elementFromPoint(x, y);
            while (hit && hit !== document.body) {
                if (hit.dataset && hit.dataset.zone !== undefined) return hit;
                hit = hit.parentElement;
            }
            return null;
        }

        /* Arrastre desde el pool */
        pool.querySelectorAll(".quiz__drag-item").forEach(function (item) {
            var product = item.dataset.product;

            item.addEventListener("touchstart", function (e) {
                e.preventDefault();
                touchItem = { product: product, fromZone: null };
            }, { passive: false });

            item.addEventListener("touchmove", function (e) {
                e.preventDefault();
            }, { passive: false });

            item.addEventListener("touchend", function (e) {
                e.preventDefault();
                if (!touchItem) return;
                var t = e.changedTouches[0];
                var zone = zoneFromPoint(t.clientX, t.clientY);
                if (zone) {
                    var zi = parseInt(zone.dataset.zone, 10);
                    var existing = zoneContent[zi];
                    hidePoolItem(product);
                    if (existing !== null) {
                        showPoolItem(existing);
                        clearZone(zi);
                    }
                    zoneContent[zi] = product;
                    renderZone(zi, product);
                    updateAnswer();
                }
                touchItem = null;
            }, { passive: false });
        });

        /* Arrastre desde las zonas (devolver o intercambiar) */
        zoneEls.forEach(function (zone, zi) {
            zone.addEventListener("touchstart", function (e) {
                if (zoneContent[zi] === null) return;
                e.preventDefault();
                touchItem = { product: zoneContent[zi], fromZone: zi };
            }, { passive: false });

            zone.addEventListener("touchmove", function (e) {
                if (touchItem && touchItem.fromZone === zi) e.preventDefault();
            }, { passive: false });

            zone.addEventListener("touchend", function (e) {
                if (!touchItem || touchItem.fromZone !== zi) { touchItem = null; return; }
                e.preventDefault();
                var t = e.changedTouches[0];
                var targetZone = zoneFromPoint(t.clientX, t.clientY);
                var product = touchItem.product;

                if (targetZone) {
                    var tzi = parseInt(targetZone.dataset.zone, 10);
                    if (tzi !== zi) {
                        var existing = zoneContent[tzi];
                        if (existing !== null) {
                            zoneContent[zi] = existing;
                            renderZone(zi, existing);
                        } else {
                            zoneContent[zi] = null;
                            clearZone(zi);
                        }
                        zoneContent[tzi] = product;
                        renderZone(tzi, product);
                    }
                } else {
                    zoneContent[zi] = null;
                    clearZone(zi);
                    showPoolItem(product);
                }

                updateAnswer();
                touchItem = null;
            }, { passive: false });
        });
    }());

})();
</script>

</body>
</html>
